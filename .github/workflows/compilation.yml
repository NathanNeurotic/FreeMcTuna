name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v1.2.0
    steps:
      - name: Install dependencies
        run: |
          apk add build-base git zip

      - uses: actions/checkout@v3

      - run: |
          git fetch --prune --unshallow

      - name: Compile
        run: |
          make

      - name: Get short SHA
        id: slug
        run: |
          echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Rename and move ELF to workspace
        run: |
          mv Installer.elf "$GITHUB_WORKSPACE/OSDMENU-OPENTUNA-${{ env.sha8 }}.ELF"

      - name: Zip ELF with README and CHANGELOG into workspace
        run: |
          cd "$GITHUB_WORKSPACE"
          zip OSDMENU-OPENTUNA-${{ env.sha8 }}.zip \
            OSDMENU-OPENTUNA-${{ env.sha8 }}.ELF \
            README.md \
            CHANGELOG.md

      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: OSDMENU-OPENTUNA-${{ env.sha8 }}
          path: |
            OSDMENU-OPENTUNA-${{ env.sha8 }}.ELF
            OSDMENU-OPENTUNA-${{ env.sha8 }}.zip

      - name: Debug - Check output files
        run: |
          ls -lah "$GITHUB_WORKSPACE"/OSDMENU-OPENTUNA-${{ env.sha8 }}.*

