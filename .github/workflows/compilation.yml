name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v1.2.0
    steps:
      - name: Install dependencies
        run: |
          apk add build-base git zip
      - uses: actions/checkout@v3
      - run: |
          git fetch --prune --unshallow
      - name: Compile
        run: |
          make
      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      # (Optional) Keep artifact upload if needed separately
      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenTuna_Installer_${{ env.sha8 }}
          path: OpenTuna_Installer.elf

      # Ensure release step can find the ELF file
      - name: Debug - Check ELF file exists
        run: ls -lah OpenTuna_Installer.elf

      - name: Create release
        if: github.ref == 'refs/heads/Free-McTuna-OpenTuna-Installer-AIO'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "FreeMcTunaAIO"
          title: "Free McTuna: OpenTuna Installer w/PS2BBL - AIO (Recommended)"
          files: OpenTuna_Installer.elf
